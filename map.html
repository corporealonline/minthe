ll Music Center", "place_address": "2400 Strawberry Mansion Dr, Philadelphia, PA 19132", "place_website": "https://www.dellmusiccenter.com", "place_description": "", "lat": 39.99544, "lng": -75.1888384}, {"place_id": "thefillmore", "place_name": "The Fillmore", "place_address": "29 E Allen St, Philadelphia, PA 19123", "place_website": "https://www.thefillmorephilly.com", "place_description": "", "lat": 39.9655391, "lng": -75.1349058}, {"place_id": "thefirstunitarianchurch", "place_name": "The First Unitarian Church", "place_address": "2125 Chestnut St, Philadelphia, PA 19103", "place_website": "https://r5productions.com", "place_description": "", "lat": 39.9527313, "lng": -75.176399}, {"place_id": "thelatviansocietyofphiladelphia", "place_name": "The Latvian Society of Philadelphia", "place_address": "531 N 7th St, Philadelphia, PA 19123", "place_website": "", "place_description": "TODO", "lat": 39.9617962, "lng": -75.149649}, {"place_id": "thesoundloungeatpercy", "place_name": "The Sound Lounge at Percy", "place_address": "1700 N Front Street, Philadelphia, PA. 19122", "place_website": "https://percyphl.com/", "place_description": "TODO", "lat": 39.9753997, "lng": -75.1344358}, {"place_id": "thewinstonphiladelphia", "place_name": "The Winston Philadelphia", "place_address": "461 N. 3rd Street Philadelphia, PA 19123", "place_website": "https://thewinstonphilly.com", "place_description": "TODO", "lat": 39.9593854, "lng": -75.1435976}, {"place_id": "trestleinn", "place_name": "Trestle Inn", "place_address": "339 N 11th St, Philadelphia, PA 19107", "place_website": "https://www.thetrestleinn.com", "place_description": "TODO", "lat": 39.9587529, "lng": -75.1565507}, {"place_id": "ukieclub", "place_name": "Ukie Club", "place_address": "847 N Franklin St, Philadelphia, PA 19123", "place_website": "", "place_description": "TODO", "lat": 39.9664031, "lng": -75.1497406}, {"place_id": "undergroundarts", "place_name": "Underground Arts", "place_address": "1200 Callowhill St, Philadelphia, PA 19123", "place_website": "https://undergroundarts.org", "place_description": "TODO", "lat": 39.9580987, "lng": -75.1496347}, {"place_id": "uniontransfer", "place_name": "Union Transfer", "place_address": "1026 Spring Garden St, Philadelphia, PA 19123", "place_website": "https://utphilly.com", "place_description": "TODO", "lat": 39.9613822, "lng": -75.1553446}, {"place_id": "vinyl", "place_name": "Vinyl", "place_address": "215 S 15th St, Philadelphia, PA 19102", "place_website": "https://www.vinylphilly.com/", "place_description": "TODO", "lat": 39.948795, "lng": -75.165997}, {"place_id": "warehouseonwatts", "place_name": "Warehouse on Watts", "place_address": "923-925 N Watts St, Philadelphia, PA 19123", "place_website": "https://wowphilly.com", "place_description": "TODO", "lat": 39.9693986, "lng": -75.1590396}];

    const map = L.map('map').setView([39.9526, -75.1652], 12);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19
    }).addTo(map);

    const markers = [];
    for (const place of places) {
        if (place.lat == null || place.lng == null) continue;

        const popupParts = [`<div class="map-popup-name">${place.place_name}</div>`];
        if (place.place_address) {
            popupParts.push(`<div class="map-popup-address">${place.place_address}</div>`);
        }
        if (place.place_website) {
            popupParts.push(`<div class="map-popup-website"><a href="${place.place_website}" target="_blank">${place.place_website.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '')}</a></div>`);
        }
        popupParts.push(`<div class="map-popup-link"><a href="places.html#${place.place_id}">More info →</a></div>`);

        const marker = L.marker([place.lat, place.lng])
            .addTo(map)
            .bindPopup(popupParts.join(''));
        markers.push(marker);
    }

    // Auto-fit to all markers if we have any
    if (markers.length > 0) {
        const group = L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.1));
    }

    // "Find me" button
    const locateBtn = L.control({ position: 'topright' });
    locateBtn.onAdd = function () {
        const btn = L.DomUtil.create('button', 'locate-btn');
        btn.innerHTML = '📍';
        btn.title = 'Find my location';
        btn.onclick = (e) => {
            e.stopPropagation();
            map.locate({ setView: true, maxZoom: 15 });
        };
        L.DomEvent.disableClickPropagation(btn);
        return btn;
    };
    locateBtn.addTo(map);

    // Track the user's location marker so we can replace it on repeated clicks
    let userMarker = null;
    let userAccuracyCircle = null;

    map.on('locationfound', (e) => {
        // Remove previous location indicators if user clicks again
        if (userMarker) map.removeLayer(userMarker);
        if (userAccuracyCircle) map.removeLayer(userAccuracyCircle);

        const userIcon = L.divIcon({
            className: 'user-location-marker',
            iconSize: [16, 16]
        });

        userMarker = L.marker(e.latlng, { icon: userIcon, zIndexOffset: 1000 })
            .addTo(map)
            .bindPopup('You are here');

        userAccuracyCircle = L.circle(e.latlng, {
            radius: e.accuracy,
            color: '#4285f4',
            fillColor: '#4285f4',
            fillOpacity: 0.1,
            weight: 1
        }).addTo(map);
    });

    map.on('locationerror', (e) => {
        alert('Could not find your location. Make sure location permission is enabled.');
    });
</script>
