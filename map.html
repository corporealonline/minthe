ptiste", "artists": "YHWH Nailgun, Morgan Garrett, and Samba Jean-Baptiste", "link": "https://4333collective.net/gigs/3e8e4c6sxfnyztz-lmjg8-5b85t-jjw8z-3w9kd-p8fwm-kkdy8-njc37-nt3nm-267xl-zagbl-r8dr7-99962-c3m7p-3kzcs-slf3m-f3cj5-7xl4b-jydaa-ntc5t-b2pk3-4pz8n-jbgzc-8e4z4-azxeg-n9478-ayt2t-3t8xn-myeae-br9g4-2n9al"}]}, {"place_id": "winstononthewater", "place_name": "Winston on the Water", "place_address": "325 N Christopher Columbus Blvd, Philadelphia, PA 19106", "place_website": "https://winstononthewater.com/", "place_description": "", "lat": 39.9515423, "lng": -75.1406064, "upcoming_events": []}, {"place_id": "worldstage", "place_name": "World Stage", "place_address": "3025 Walnut St, Philadelphia, PA 19104", "place_website": "", "place_description": "", "lat": 39.9521611, "lng": -75.1851511, "upcoming_events": [{"date": "Friday 11/13/2026", "title": "***moved To Tempo*** Kpop Club Night", "artists": "***MOVED TO TEMPO*** Kpop Club Night", "link": "https://davekisspresents.com/event/moved-to-tempo-kpop-club-night/world-stage/"}, {"date": "Sunday 11/22/2026", "title": "First To Eleven", "artists": "First to Eleven", "link": "https://davekisspresents.com/event/first-to-eleven-2/world-stage/"}]}];

    const map = L.map('map').setView([39.9526, -75.1652], 12);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19
    }).addTo(map);

    // Event text comes from scraped websites, so escape it before putting it in HTML.
    function escapeHtml(text) {
        return String(text ?? '')
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // Upcoming shows for one place (same list as places.html). generate_html.py adds place.upcoming_events.
    function showsHtml(events) {
        if (!events || events.length === 0) {
            return '<div class="map-popup-no-shows">No upcoming shows.</div>';
        }
        const rows = events.map(ev => {
            const title = ev.link
                ? `<a href="${escapeHtml(ev.link)}" target="_blank" rel="noopener">${escapeHtml(ev.title)}</a>`
                : escapeHtml(ev.title);
            return `<div class="map-popup-show">
                <div class="map-popup-show-date">${escapeHtml(ev.date)}</div>
                <div class="map-popup-show-title">${title}</div>
                ${ev.artists ? `<div class="map-popup-show-artists">${escapeHtml(ev.artists)}</div>` : ''}
            </div>`;
        });
        return `<div class="map-popup-shows-heading">Upcoming shows (${events.length})</div>`
            + `<div class="map-popup-shows">${rows.join('')}</div>`;
    }

    const markers = [];
    for (const place of places) {
        if (place.lat == null || place.lng == null) continue;

        const popupParts = [`<div class="map-popup-name">${place.place_name}</div>`];
        if (place.place_address) {
            popupParts.push(`<div class="map-popup-address">${place.place_address}</div>`);
        }
        if (place.place_website) {
            popupParts.push(`<div class="map-popup-website"><a href="${place.place_website}" target="_blank">${place.place_website.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '')}</a></div>`);
        }
        popupParts.push(showsHtml(place.upcoming_events));
        popupParts.push(`<div class="map-popup-link"><a href="places.html#${place.place_id}">More info →</a></div>`);

        const marker = L.marker([place.lat, place.lng])
            .addTo(map)
            .bindPopup(popupParts.join(''));
        markers.push(marker);
    }

    // Auto-fit to all markers if we have any
    if (markers.length > 0) {
        const group = L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.1));
    }

    // "Find me" button
    const locateBtn = L.control({ position: 'topright' });
    locateBtn.onAdd = function () {
        const btn = L.DomUtil.create('button', 'locate-btn');
        btn.innerHTML = '📍';
        btn.title = 'Find my location';
        btn.onclick = (e) => {
            e.stopPropagation();
            map.locate({ setView: true, maxZoom: 15 });
        };
        L.DomEvent.disableClickPropagation(btn);
        return btn;
    };
    locateBtn.addTo(map);

    // Track the user's location marker so we can replace it on repeated clicks
    let userMarker = null;
    let userAccuracyCircle = null;

    map.on('locationfound', (e) => {
        // Remove previous location indicators if user clicks again
        if (userMarker) map.removeLayer(userMarker);
        if (userAccuracyCircle) map.removeLayer(userAccuracyCircle);

        const userIcon = L.divIcon({
            className: 'user-location-marker',
            iconSize: [16, 16]
        });

        userMarker = L.marker(e.latlng, { icon: userIcon, zIndexOffset: 1000 })
            .addTo(map)
            .bindPopup('You are here');

        userAccuracyCircle = L.circle(e.latlng, {
            radius: e.accuracy,
            color: '#4285f4',
            fillColor: '#4285f4',
            fillOpacity: 0.1,
            weight: 1
        }).addTo(map);
    });

    map.on('locationerror', (e) => {
        alert('Could not find your location. Make sure location permission is enabled.');
    });
</script>
